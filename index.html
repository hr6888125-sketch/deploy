<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCX Style</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #d9f0ff;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffd400;
      padding: 10px 20px;
    }

    .logo {
      font-weight: bold;
      font-size: 22px;
    }

    input {
      padding: 8px;
      width: 250px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    nav button {
      margin-left: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      background: #ffffff;
    }

    /* PRODUTOS */
    .grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 50px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      width: 200px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card button {
      margin-top: 10px;
      padding: 8px;
      border: none;
      background: #ffd400;
      cursor: pointer;
      border-radius: 10px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 250px;
    }

    .modal-box input {
      width: 100%;
      margin: 5px 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo"> 𝕽𝕮𝖃</div>

    <input type="text" id="search" placeholder="Pesquisar produtos..." />

    <nav>
      <button onclick="scrollToProducts()">Produtos</button>
      <button onclick="alert('Contato em construção')">Contato</button>
      <button onclick="openLogin()">Entrar</button>
    </nav>
  </header>

  <!-- PRODUTOS -->
  <main>
    <section id="produtos" class="grid">

      <div class="card" data-name="angel shirt">
        <img src="ChatGPT Image 19 de fev. de 2026, 16_41_58.png" />
        <h3>Angel Shirt</h3>
        <p>R$ 120,00</p>
        <button onclick="addCart('Angel Shirt')">Adicionar</button>
      </div>

      <div class="card" data-name="toxic shirt">
        <img src="Toxic mockup.png" />
        <h3>Toxic Shirt</h3>
        <p>R$ 100,00</p>
        <button onclick="addCart('Toxic Shirt')">Adicionar</button>
      </div>

    </section>
  </main>

  <!-- MODAL LOGIN -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2>Login</h2>
      <input placeholder="Usuário"/>
      <input type="password" placeholder="Senha"/>
      <button onclick="closeLogin()">Fechar</button>
    </div>
  </div>

  <script>
    // BUSCA
    const search = document.getElementById("search");

    search.addEventListener("input", function () {
      const value = this.value.toLowerCase();
      const cards = document.querySelectorAll(".card");

      cards.forEach(card => {
        const name = card.getAttribute("data-name");
        card.style.display = name.includes(value) ? "block" : "none";
      });
    });

    // SCROLL
    function scrollToProducts() {
      document.getElementById("produtos").scrollIntoView({ behavior: "smooth" });
    }

    // CARRINHO
    function addCart(product) {
      alert(product + " adicionado ao carrinho 🛒");
    }

    // LOGIN
    function openLogin() {
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeLogin() {
      document.getElementById("modal").classList.add("hidden");
    }
  </script>

</body>
</html>
